name: Build OfferWatch APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/offerwatch

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'OfferWatch'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.offerwatch'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.offerwatch'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '0.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="OfferWatch"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OfferService"
                      android:exported="true"
                      android:label="OfferWatch"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/offerwatch/OfferService.java <<'EOF'
          package com.offerwatch;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.AccessibilityServiceInfo;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class OfferService extends AccessibilityService {
              static final String FILE = "captures.txt";
              long lastRun = 0;
              String lastText = "";

              @Override
              protected void onServiceConnected() {
                  AccessibilityServiceInfo i = new AccessibilityServiceInfo();
                  i.eventTypes = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED
                          | AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED;
                  i.feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC;
                  i.flags = AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS
                          | AccessibilityServiceInfo.FLAG_INCLUDE_NOT_IMPORTANT_VIEWS;
                  i.notificationTimeout = 100;
                  setServiceInfo(i);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e.getPackageName() == null) return;
                  String p = e.getPackageName().toString();
                  if (!p.equals("ee.mtakso.driver") && !p.equals("com.ubercab.driver")) return;
                  long now = System.currentTimeMillis();
                  if (now - lastRun < 400) return;
                  lastRun = now;
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) root = e.getSource();
                  if (root == null) return;
                  StringBuilder sb = new StringBuilder();
                  walk(root, sb, 0);
                  String t = sb.toString();
                  if (!t.toLowerCase(Locale.ROOT).contains("km")) return;
                  if (t.equals(lastText)) return;
                  lastText = t;
                  save(p, t);
              }

              void walk(AccessibilityNodeInfo n, StringBuilder sb, int d) {
                  if (n == null || d > 40) return;
                  CharSequence tx = n.getText();
                  CharSequence cd = n.getContentDescription();
                  String id = n.getViewIdResourceName();
                  boolean hasTx = tx != null && tx.length() > 0;
                  boolean hasCd = cd != null && cd.length() > 0;
                  if (hasTx || hasCd) {
                      sb.append(hasTx ? tx : "").append(" | ")
                        .append(hasCd ? cd : "").append(" | ")
                        .append(id == null ? "" : id).append("\n");
                  }
                  for (int i = 0; i < n.getChildCount(); i++) {
                      walk(n.getChild(i), sb, d + 1);
                  }
              }

              void save(String pkg, String text) {
                  try {
                      File f = new File(getFilesDir(), FILE);
                      String old = read(f);
